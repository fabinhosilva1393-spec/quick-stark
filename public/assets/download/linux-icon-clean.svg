<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-label="Linux Tux">
  <defs>
    <radialGradient id="tuxBody" cx="42%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="55%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="tuxBelly" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#eaeaea"/>
      <stop offset="100%" stop-color="#c9c9c9"/>
    </radialGradient>
    <linearGradient id="tuxFeet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb02e"/>
      <stop offset="100%" stop-color="#e07a00"/>
    </linearGradient>
    <radialGradient id="tuxEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6e6e6"/>
    </radialGradient>
  </defs>

  <!-- Feet -->
  <ellipse cx="70" cy="222" rx="30" ry="12" fill="url(#tuxFeet)"/>
  <ellipse cx="130" cy="222" rx="30" ry="12" fill="url(#tuxFeet)"/>

  <!-- Body (black outer silhouette) -->
  <path d="M100 32
           C 60 32, 40 66, 40 108
           C 40 138, 46 168, 54 190
           C 60 208, 80 218, 100 218
           C 120 218, 140 208, 146 190
           C 154 168, 160 138, 160 108
           C 160 66, 140 32, 100 32 Z"
        fill="url(#tuxBody)"/>

  <!-- White belly -->
  <path d="M100 88
           C 78 88, 66 108, 66 140
           C 66 170, 78 200, 100 204
           C 122 200, 134 170, 134 140
           C 134 108, 122 88, 100 88 Z"
        fill="url(#tuxBelly)"/>

  <!-- Beak -->
  <path d="M86 108 L114 108 L108 122 Q100 128 92 122 Z" fill="#f5a623"/>
  <path d="M92 122 Q100 128 108 122 L106 126 Q100 130 94 126 Z" fill="#c67c00"/>

  <!-- Eye whites -->
  <ellipse cx="86" cy="94" rx="12" ry="15" fill="url(#tuxEye)"/>
  <ellipse cx="114" cy="94" rx="12" ry="15" fill="url(#tuxEye)"/>

  <!-- Pupils -->
  <ellipse cx="89" cy="96" rx="4.5" ry="6" fill="#0a0a0a"/>
  <ellipse cx="111" cy="96" rx="4.5" ry="6" fill="#0a0a0a"/>

  <!-- Catchlights -->
  <circle cx="90.5" cy="93" r="1.6" fill="#ffffff"/>
  <circle cx="112.5" cy="93" r="1.6" fill="#ffffff"/>

  <!-- Flippers -->
  <path d="M46 128 C 34 138, 32 168, 46 182 C 52 172, 54 156, 52 140 Z" fill="url(#tuxBody)"/>
  <path d="M154 128 C 166 138, 168 168, 154 182 C 148 172, 146 156, 148 140 Z" fill="url(#tuxBody)"/>
</svg>
