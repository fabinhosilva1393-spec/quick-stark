<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
<title id="title">macOS animated support base</title>
<desc id="desc">A layered isometric support base with animated orbit lines and glowing particles.</desc>
<defs>
  <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#30346D"/>
    <stop offset="55%" stop-color="#282B5E"/>
    <stop offset="100%" stop-color="#15172F"/>
  </linearGradient>
  <linearGradient id="surface2" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#3A438B"/>
    <stop offset="100%" stop-color="#20234D"/>
  </linearGradient>
  <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1A1C3D"/>
    <stop offset="100%" stop-color="#090A1B"/>
  </linearGradient>
  <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2B2E61"/>
    <stop offset="100%" stop-color="#101229"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#F0A8B7"/>
    <stop offset="46%" stop-color="#C99CD2"/>
    <stop offset="100%" stop-color="#C3B4F5"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="45%" r="60%">
    <stop offset="0%" stop-color="#C3B4F5" stop-opacity=".18"/>
    <stop offset="58%" stop-color="#8C65D9" stop-opacity=".07"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%">
    <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#02030A" flood-opacity=".78"/>
  </filter>
  <filter id="tinyGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1.1" fill="#9E93E9" opacity=".19"/>
  </pattern>
  <style>
    .orbitA{transform-box:fill-box;transform-origin:center;animation:spinA 17s linear infinite}
    .orbitB{transform-box:fill-box;transform-origin:center;animation:spinB 23s linear infinite reverse}
    .base{transform-box:fill-box;transform-origin:center;animation:floatBase 6s ease-in-out infinite}
    .edgePulse{animation:edgePulse 3.7s ease-in-out infinite}
    .twinkle{animation:twinkle 2.8s ease-in-out infinite}
    .twinkle2{animation:twinkle 3.6s ease-in-out infinite .7s}
    @keyframes spinA{to{transform:rotate(360deg)}}
    @keyframes spinB{to{transform:rotate(360deg)}}
    @keyframes floatBase{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
    @keyframes edgePulse{0%,100%{opacity:.72}50%{opacity:1}}
    @keyframes twinkle{0%,100%{opacity:.22;transform:scale(.8)}50%{opacity:1;transform:scale(1.14)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
</defs>
<ellipse cx="300" cy="200" rx="240" ry="122" fill="url(#glow)"/>
<rect x="55" y="225" width="490" height="105" fill="url(#dots)" opacity=".45"/>

<g class="orbitA">
  <ellipse cx="300" cy="190" rx="222" ry="78" fill="none" stroke="#7A5CC4" stroke-width="1.5" opacity=".55"/>
  <circle cx="91" cy="168" r="5.5" fill="#E2B9EF" filter="url(#tinyGlow)"/>
  <circle cx="500" cy="217" r="4.5" fill="#C3B4F5" filter="url(#tinyGlow)"/>
</g>
<g class="orbitB">
  <ellipse cx="300" cy="190" rx="166" ry="57" fill="none" stroke="#5667CA" stroke-width="1.3" opacity=".50"/>
  <circle cx="224" cy="143" r="4" fill="#7B92FF" filter="url(#tinyGlow)"/>
  <circle cx="394" cy="235" r="4.5" fill="#F0A8B7" filter="url(#tinyGlow)"/>
</g>

<g class="base" filter="url(#shadow)">
  <path d="M179 264 300 195 423 264 301 334Z" fill="#070915"/>
  <path d="M179 264 301 334 301 351 179 281Z" fill="#03040C"/>
  <path d="M423 264 301 334 301 351 423 281Z" fill="#11142C"/>

  <path d="M194 248 300 188 406 248 300 310Z" fill="url(#surface)" stroke="#6561A0" stroke-width="1.6"/>
  <path d="M194 248 300 310 300 327 194 265Z" fill="url(#left)"/>
  <path d="M406 248 300 310 300 327 406 265Z" fill="url(#right)"/>
  <path d="M198 266 300 324 402 266" fill="none" stroke="url(#edge)" stroke-width="3.2" class="edgePulse"/>

  <path d="M215 227 300 178 385 227 300 277Z" fill="url(#surface)" stroke="#7571B4" stroke-width="1.6"/>
  <path d="M215 227 300 277 300 293 215 243Z" fill="url(#left)"/>
  <path d="M385 227 300 277 300 293 385 243Z" fill="url(#right)"/>
  <path d="M219 243 300 290 381 243" fill="none" stroke="url(#edge)" stroke-width="3.2" class="edgePulse"/>

  <path d="M238 203 300 167 363 203 300 240Z" fill="url(#surface2)" stroke="#9D9CEB" stroke-width="1.6"/>
  <path d="M238 203 300 240 300 253 238 216Z" fill="#191D48"/>
  <path d="M363 203 300 240 300 253 363 216Z" fill="#2B3069"/>
  <path d="M244 215 300 247 357 215" fill="none" stroke="url(#edge)" stroke-width="3" class="edgePulse"/>

  <path d="M264 199 300 178 336 199 300 220Z" fill="#2D3575"/>
  <path d="M276 199 300 185 324 199 300 213Z" fill="none" stroke="#A3B8FF" stroke-width="1" opacity=".58"/>

  <path d="M162 278 181 268 200 278 181 289Z" fill="#2A2B59"/>
  <path d="M162 278 181 289 181 304 162 293Z" fill="#151632"/>
  <path d="M200 278 181 289 181 304 200 293Z" fill="#3A3C75"/>

  <path d="M401 269 420 259 439 269 420 280Z" fill="#2A2B59"/>
  <path d="M401 269 420 280 420 295 401 284Z" fill="#151632"/>
  <path d="M439 269 420 280 420 295 439 284Z" fill="#3A3C75"/>
</g>

<circle cx="111" cy="252" r="3" fill="#F0A8B7" class="twinkle"/>
<circle cx="513" cy="149" r="3.5" fill="#C3B4F5" class="twinkle2"/>
<circle cx="482" cy="284" r="2.5" fill="#8EA1F7" class="twinkle"/>
<circle cx="150" cy="126" r="2.4" fill="#D2A8E4" class="twinkle2"/>
</svg>