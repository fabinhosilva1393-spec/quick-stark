<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="title desc">
<title id="title">Animated Starknet signing station</title>
<desc id="desc">An original isometric wallet signing station with transaction layers, validation nodes and rotating tokens.</desc>

<defs>
  <linearGradient id="gPinkLav" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F1A7AF"/>
    <stop offset="48%" stop-color="#C89CD1"/>
    <stop offset="100%" stop-color="#8E95E8"/>
  </linearGradient>
  <linearGradient id="gCoral" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFB0A9"/>
    <stop offset="100%" stop-color="#E86F97"/>
  </linearGradient>
  <linearGradient id="gLav" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#C7B6FF"/>
    <stop offset="100%" stop-color="#747DE2"/>
  </linearGradient>
  <linearGradient id="gMint" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#C4F1D8"/>
    <stop offset="100%" stop-color="#6ED0B3"/>
  </linearGradient>
  <linearGradient id="gYellow" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F8F0A8"/>
    <stop offset="100%" stop-color="#D7CC55"/>
  </linearGradient>
  <linearGradient id="gDark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#24244E"/>
    <stop offset="100%" stop-color="#11142E"/>
  </linearGradient>
  <radialGradient id="gCoin" cx="35%" cy="25%" r="85%">
    <stop offset="0%" stop-color="#F5B8C2"/>
    <stop offset="55%" stop-color="#A58EE7"/>
    <stop offset="100%" stop-color="#5C59B8"/>
  </radialGradient>
  <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#070713" flood-opacity="0.38"/>
  </filter>
  <filter id="tinyGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.5" fill="#8D86D8" opacity=".46"/>
  </pattern>
  <style>
    .line{fill:none;stroke:#756B9E;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
    .lineSoft{fill:none;stroke:#8E83BC;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.45}
    .node{fill:#F3B0BD;stroke:#211F47;stroke-width:2}
    .nodeMint{fill:#8FDEBF;stroke:#211F47;stroke-width:2}
    .nodeLav{fill:#9A93EC;stroke:#211F47;stroke-width:2}
    .floatSlow{animation:floatSlow 5.6s ease-in-out infinite}
    .floatMed{animation:floatMed 4.2s ease-in-out infinite}
    .floatFast{animation:floatFast 3.3s ease-in-out infinite}
    .pulse{transform-origin:center;animation:pulse 2.8s ease-in-out infinite}
    .spinSlow{transform-box:fill-box;transform-origin:center;animation:spinSlow 12s linear infinite}
    .tilt{transform-box:fill-box;transform-origin:center;animation:tilt 5.2s ease-in-out infinite}
    .slide{animation:slide 4.6s ease-in-out infinite}
    .blink{animation:blink 2.4s ease-in-out infinite}
    .dash{stroke-dasharray:8 10;animation:dash 8s linear infinite}
    @keyframes floatSlow{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    @keyframes floatMed{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
    @keyframes floatFast{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:1}}
    @keyframes spinSlow{to{transform:rotate(360deg)}}
    @keyframes tilt{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.5deg)}}
    @keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(9px)}}
    @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes dash{to{stroke-dashoffset:-180}}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
    }
  </style>
</defs>


<g filter="url(#softShadow)">
  <path d="M110 365 310 250 530 365 325 486Z" fill="#11132D"/>
  <path d="M110 365 325 486 325 507 110 386Z" fill="#0A0C22"/>
  <path d="M530 365 325 486 325 507 530 386Z" fill="#17183B"/>
  <path d="M140 351 313 252 503 353 322 457Z" fill="url(#gDark)" stroke="#4B457B" stroke-width="2"/>
  <path d="M169 335 313 252 468 337 319 422Z" fill="url(#gPinkLav)" stroke="#F4C1D0" stroke-width="2" class="floatSlow"/>
  <path d="M196 327 312 261 438 328 317 397Z" fill="#20254F" opacity=".93"/>
  <g fill="#EEDAF7">
    <ellipse cx="227" cy="322" rx="8" ry="5"/><ellipse cx="252" cy="308" rx="8" ry="5"/>
    <ellipse cx="278" cy="294" rx="8" ry="5"/><ellipse cx="304" cy="280" rx="8" ry="5"/>
    <ellipse cx="255" cy="336" rx="8" ry="5"/><ellipse cx="281" cy="322" rx="8" ry="5"/>
    <ellipse cx="307" cy="308" rx="8" ry="5"/><ellipse cx="333" cy="294" rx="8" ry="5"/>
    <ellipse cx="283" cy="350" rx="8" ry="5"/><ellipse cx="309" cy="336" rx="8" ry="5"/>
    <ellipse cx="335" cy="322" rx="8" ry="5"/><ellipse cx="361" cy="308" rx="8" ry="5"/>
    <ellipse cx="312" cy="364" rx="8" ry="5"/><ellipse cx="338" cy="350" rx="8" ry="5"/>
    <ellipse cx="364" cy="336" rx="8" ry="5"/><ellipse cx="390" cy="322" rx="8" ry="5"/>
  </g>
  <g class="floatMed">
    <path d="M357 239 400 215 445 239 402 264Z" fill="#E9EFF7" stroke="#292951" stroke-width="2"/>
    <path d="M357 239 402 264 402 315 357 290Z" fill="#ABB9E9" stroke="#292951" stroke-width="2"/>
    <path d="M445 239 402 264 402 315 445 289Z" fill="#6E78D7" stroke="#292951" stroke-width="2"/>
    <path d="M386 264 397 275 420 251" class="line" stroke="#18213C" stroke-width="7"/>
  </g>
  <g class="slide">
    <path d="M384 354 461 311 501 332 423 377Z" fill="#F1DDE8" stroke="#2A294E" stroke-width="2"/>
    <path d="M423 377 501 332 501 348 423 393Z" fill="#A78EDD"/>
    <path d="M404 352 447 328" class="line" stroke="#5B567E"/>
    <path d="M419 360 463 336" class="line" stroke="#5B567E"/>
  </g>
  <g class="spinSlow">
    <ellipse cx="206" cy="409" rx="43" ry="23" fill="#4D4AA0"/>
    <ellipse cx="206" cy="401" rx="43" ry="23" fill="url(#gCoin)" stroke="#EAC5E8" stroke-width="2"/>
    <path d="M190 403c9-15 25-15 34 0-7 14-27 14-34 0Z" fill="#15183B"/>
    <circle cx="207" cy="400" r="6" fill="#EDB5C1"/>
  </g>
  <g class="floatFast">
    <ellipse cx="273" cy="444" rx="39" ry="19" fill="#5F5BC1"/>
    <ellipse cx="273" cy="437" rx="39" ry="19" fill="url(#gCoin)" stroke="#EAC5E8" stroke-width="2"/>
    <path d="M257 439c9-14 24-14 33 0-7 12-26 12-33 0Z" fill="#15183B"/>
  </g>
  <g class="floatMed">
    <ellipse cx="339" cy="468" rx="37" ry="18" fill="#4B48A0"/>
    <ellipse cx="339" cy="461" rx="37" ry="18" fill="url(#gCoin)" stroke="#EAC5E8" stroke-width="2"/>
    <path d="M323 463c9-14 24-14 33 0-7 12-26 12-33 0Z" fill="#15183B"/>
  </g>
</g>
<path d="M101 259 101 184 175 143M175 143 247 180M448 166 520 205 520 287" class="lineSoft"/>
<path d="M94 422 56 400 56 344M503 447 572 409 572 337" class="lineSoft"/>
<circle cx="101" cy="184" r="7" class="nodeMint pulse"/><circle cx="175" cy="143" r="7" class="node"/>
<circle cx="247" cy="180" r="6" class="nodeLav blink"/><circle cx="448" cy="166" r="7" class="node"/>
<circle cx="520" cy="205" r="6" class="nodeMint"/><circle cx="56" cy="344" r="7" class="node"/>
<circle cx="572" cy="337" r="7" class="nodeLav pulse"/>
<path d="M121 462C227 531 439 529 536 446" class="line dash"/>
<g class="floatFast">
  <path d="M149 251v-23c0-15 11-26 26-26s26 11 26 26v23" class="line" stroke="#89DDBB" stroke-width="7"/>
  <rect x="141" y="245" width="68" height="51" rx="11" fill="url(#gMint)" stroke="#24264C" stroke-width="3"/>
  <circle cx="175" cy="270" r="7" fill="#17203B"/>
</g>

</svg>